name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Minimal Android Project Structure
      run: |
        mkdir -p app/src/main/java/net/basaranteknoloji/owa
        mkdir -p app/src/main/res/mipmap-hdpi
        
        # AndroidManifest.xml oluşturuluyor
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res.android"
            package="net.basaranteknoloji.owa">
            <application
                android:allowBackup="true"
                android:label="BAŞARAN"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity.java oluşturuluyor
        cat << 'EOF' > app/src/main/java/net/basaranteknoloji/owa/MainActivity.java
        package net.basaranteknoloji.owa;

        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                String owaUrl = "https://mail.basaranteknoloji.net/owa";
                Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(owaUrl));
                try {
                    startActivity(intent);
                } catch (Exception e) {
                    e.printStackTrace();
                } finally {
                    finish();
                }
            }
        }
        EOF

        # build.gradle (Project) oluşturuluyor
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # build.gradle (Module app) oluşturuluyor
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "net.basaranteknoloji.owa"
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # settings.gradle oluşturuluyor
        cat << 'EOF' > settings.gradle
        include ':app'
        EOF

    - name: Build with Gradle
      run: |
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BASARAN-Mail-APK
        path: app/build/outputs/apk/debug/app-debug.apk
